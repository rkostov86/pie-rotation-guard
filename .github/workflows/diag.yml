name: diag-network

on:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe data hosts
        run: |
          mkdir -p results
          {
            echo "fred_api (no key, expect 400): $(curl -s -o /dev/null -m 30 -w '%{http_code} %{time_total}s' 'https://api.stlouisfed.org/fred/series?series_id=DGS10' || echo FAIL)"
            echo "fred_csv: $(curl -s -o /dev/null -m 60 -w '%{http_code} %{time_total}s' 'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-01-01' || echo FAIL)"
            echo "yahoo: $(curl -s -o /dev/null -m 30 -A 'Mozilla/5.0' -w '%{http_code} %{time_total}s' 'https://query1.finance.yahoo.com/v8/finance/chart/%5ETNX?range=5d&interval=1d' || echo FAIL)"
            echo "ntfy: $(curl -s -o /dev/null -m 30 -w '%{http_code} %{time_total}s' 'https://ntfy.sh/v1/health' || echo FAIL)"
          } | tee results/diag.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "pie-rotation-guard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results/diag.txt
          git commit -m "Network diag [skip ci]" || true
          git pull --rebase origin main && git push origin HEAD:main
