name: backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backtest.py"
      - "pierg/**"
      - "requirements.txt"
      - ".github/workflows/backtest.yml"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Run backtest
        run: |
          mkdir -p results
          set -o pipefail
          python backtest.py 2>&1 | tee results/run_log.txt
      - name: Commit results (also on failure, so the log is visible)
        if: always()
        run: |
          git config user.name "pie-rotation-guard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add results
          git commit -m "Backtest results [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push origin HEAD:main
